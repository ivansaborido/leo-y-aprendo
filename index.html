<style>
:root{--bg:#FFF8EC;--card:#fff;--ink:#1f2a37;--muted:#5f6b7a;--line:#eadfcb;--accent:#2f6fd6;--accent2:#1d55ad;--ok:#1f9d55;--okbg:#e3f6ea;--ko:#d64545;--kobg:#fde8e8;--hl:#FFE27A;--turn:#c7f0d4;--c:#2f6fd6;
--font:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;--fs:24px;--lh:1.9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font)}
body{font-size:18px;-webkit-text-size-adjust:100%;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font-family:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.wrap{max-width:920px;margin:0 auto;padding:16px 16px 60px}
.center{text-align:center}
h1{font-size:34px;margin:8px 0}h2{font-size:26px;margin:6px 0 12px}h3{font-size:21px;margin:4px 0 8px}
.hint{color:var(--muted);font-size:16px;line-height:1.45}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:2px solid var(--line)}
.top .inner{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:12px;width:100%}
.avatar{font-size:38px;width:64px;height:64px;flex:0 0 64px;border-radius:50%;border:3px solid #fff;background:#ffe3a8;box-shadow:0 2px 0 var(--line);cursor:pointer;padding:0}
.hello{flex:1;min-width:0}.hello b{font-size:22px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);flex-wrap:wrap;margin-top:2px}
.lvbar{flex:0 0 110px;height:10px;background:#efe3cc;border-radius:9px;overflow:hidden}.lvbar i{display:block;height:100%;background:linear-gradient(90deg,#f7b733,#fc6a1a)}
.streak{font-size:20px;font-weight:700;background:#fff;border-radius:14px;padding:8px 12px;border:2px solid var(--line);white-space:nowrap}
.ico{min-width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:21px;font-weight:700;cursor:pointer;padding:0 10px}
.ttl{flex:1;font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:10px;overflow-x:auto;padding:14px 16px 6px;max-width:920px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 18px;border-radius:999px;border:3px solid var(--c);background:#fff;font-size:19px;font-weight:700;min-height:54px;cursor:pointer}
.tab.on{background:var(--c);color:#fff}
.tab.add{border-style:dashed;border-color:#b9ab8f;color:#7b6b4f}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:10px 20px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:19px;font-weight:700;box-shadow:0 3px 0 var(--line);cursor:pointer;text-decoration:none;color:var(--ink);text-align:center;line-height:1.2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent2)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 3px 0 #157341}
.btn.warn{color:var(--ko)}
.btn.big{min-height:66px;font-size:22px;width:100%}
.btn.sm{min-height:44px;font-size:16px;padding:6px 14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>.btn{flex:1 1 200px}
.between{justify-content:space-between}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 3px 0 var(--line)}
label.lb{display:block;font-weight:700;margin:16px 0 8px;font-size:18px}
.inp{width:100%;font-size:20px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fffdf8}
textarea.inp{font-size:17px;line-height:1.5}
.avs{display:flex;gap:10px;flex-wrap:wrap}
.av{font-size:38px;width:66px;height:66px;border-radius:18px;border:3px solid var(--line);background:#fff;cursor:pointer;position:relative;padding:0}
.av.on{border-color:var(--accent);background:#eaf2ff}
.av.lock{filter:grayscale(1);opacity:.45}
.av small{position:absolute;bottom:-2px;right:-2px;font-size:12px;background:#333;color:#fff;border-radius:8px;padding:1px 5px}
.subhead{border-left:8px solid var(--c);padding-left:14px;margin:10px 0 6px}
.tile{flex:1 1 220px;flex-direction:row;font-size:20px;min-height:70px}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.tema{background:#fff;border:2px solid var(--line);border-top:8px solid var(--c);border-radius:20px;padding:16px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:12px}
.tema h3{margin:0;font-size:21px;line-height:1.25}
.tstats{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:16px}
.tstats .mini{flex:1}
.mbar{height:12px;background:#f0e8d8;border-radius:9px;overflow:hidden;margin-top:5px}.mbar i{display:block;height:100%;background:var(--c)}
.ring{width:66px;height:66px;flex:0 0 66px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),#efe6d4 0);display:grid;place-items:center}
.ring span{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--ink)}
.tema .row>.btn{flex:1 1 120px}
.addtema{border:3px dashed #c9b994;border-radius:20px;background:transparent;font-size:21px;font-weight:700;color:#7b6b4f;min-height:150px;cursor:pointer}
.addtema small{font-weight:400;font-size:16px}
.empty{text-align:center;padding:40px 20px}.empty .big{font-size:80px}
.badge{display:inline-block;background:#ffe9b0;border-radius:10px;padding:2px 10px;font-size:14px;font-weight:700;color:#7a5200}
/* lectura */
.steps{display:flex;gap:6px;margin:4px 0 10px}.steps i{flex:1;height:10px;border-radius:9px;background:#eadfca}.steps i.d{background:var(--ok)}.steps i.c{background:var(--accent)}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin:10px 0}
.seg button{flex:1;min-height:52px;border:none;border-radius:12px;background:transparent;font-size:17px;font-weight:700;cursor:pointer;padding:4px 6px}
.seg button.on{background:var(--accent);color:#fff}
.seg.sm button{min-height:44px;font-size:16px}
.seg.sm button.on{background:#ffcf5c;color:#3b2a00}
.text{font-size:var(--fs);line-height:var(--lh);letter-spacing:.03em;word-spacing:.14em;border-top:8px solid var(--c)}
.text p{margin:0 0 .7em;max-width:62ch}
.text p.bl{padding-left:1.1em;text-indent:-1.1em}
.ftitle{font-size:calc(var(--fs) + 2px);line-height:1.3;margin:0 0 14px}
.ftitle small{display:block;font-size:15px;color:var(--muted);font-weight:400;letter-spacing:0}
.s{border-radius:8px;padding:1px 2px;transition:background .25s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s.mine{background:linear-gradient(transparent 82%,#bfe8cc 82%)}
.s.cur{background:var(--hl)}
.s.cur.mine{background:var(--turn);outline:3px solid #27a35a}
.w{cursor:pointer;border-radius:5px}
.w.g{border-bottom:3px dotted var(--c);font-weight:700}
.w:active{background:#dbe8ff}
.ctl{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.ctl .btn{flex:1 1 200px}
.turn{background:var(--turn);border:3px solid #27a35a;border-radius:18px;padding:14px;font-size:21px;font-weight:700;text-align:center;margin:10px 0;animation:pulse 1.8s infinite}
.listen{background:#fff6d6;border:2px solid #f0d36b;border-radius:16px;padding:12px;font-size:18px;text-align:center;margin:10px 0}
.donebox{background:var(--okbg);border:3px solid var(--ok);border-radius:18px;padding:16px;text-align:center;font-size:22px;font-weight:700;margin:10px 0}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.navrow .btn{flex:0 1 auto}

/* ================== estado y guardado ================== */
function defState(){return{v:1,setup:false,profile:{name:'',avatar:'🦊'},
 settings:{pin:'',apiKey:'',model:'gemini-2.5-flash',font:'atkinson',fs:21,lh:1.8,bg:'crema',rate:0.9,voiceURI:'',sessionLen:8,breakMin:15,autoRead:true,sound:true,twoStep:true,hints:true,readMode:'turnos'},
 subjects:[],qstats:{},devstats:{},history:[],rlog:{},trash:[],lastBackup:0,lastSnap:'',stars:0,streak:{last:'',n:0},badges:[],readStars:{},activeSubject:null}}
let S=defState();
const DB={db:null,
 async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('leoyaprendo',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
 get(k){if(!this.db){try{return Promise.resolve(JSON.parse(localStorage.getItem('lya_'+k)))}catch(e){return Promise.resolve(null)}}
  return new Promise(res=>{try{const r=this.db.transaction('kv','readonly').objectStore('kv').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(e){res(null)}})},
 set(k,v){if(!this.db){try{localStorage.setItem('lya_'+k,JSON.stringify(v))}catch(e){toast('⚠️ No queda espacio para guardar')}return Promise.resolve()}
  return new Promise(res=>{try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})}};
DB.keys=function(){if(!this.db)return Promise.resolve(Object.keys(localStorage).filter(k=>k.startsWith('lya_')).map(k=>k.slice(4)));
 return new Promise(res=>{try{const r=this.db.transaction('kv','readonly').objectStore('kv').getAllKeys();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([])}catch(e){res([])}})};
DB.del=function(k){if(!this.db){localStorage.removeItem('lya_'+k);return Promise.resolve()}
 return new Promise(res=>{try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})};
async function snapshot(reason){if(!S.setup)return;try{await DB.set('snap_'+new Date().toISOString().replace(/[:.]/g,'-'),{d:Date.now(),reason,state:JSON.parse(JSON.stringify(S))});
 const ks=(await DB.keys()).filter(x=>String(x).startsWith('snap_')).sort();while(ks.length>14)await DB.del(ks.shift())}catch(e){}}

const TTS={ok:'speechSynthesis' in window,voices:[],voice:null,tok:0,
 load(){if(!this.ok)return;const p=()=>{this.voices=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));const pref=S.settings.voiceURI;
  this.voice=this.voices.find(v=>v.voiceURI===pref)||this.voices.find(v=>/es[-_]ES/i.test(v.lang)&&/(m[oó]nica|marisol|jorge|paulina|elvira|alvaro)/i.test(v.name))||this.voices.find(v=>/es[-_]ES/i.test(v.lang))||this.voices[0]||null};
  p();speechSynthesis.onvoiceschanged=p},
 clean(t){return String(t).replace(/_{2,}/g,' ... ').replace(/[•●▪■]/g,'').replace(/\p{Extended_Pictographic}/gu,'').replace(/\s+/g,' ').trim()},
 speak(t,rate){return new Promise(res=>{if(!this.ok){res();return}const tx=this.clean(t);if(!tx){res();return}
  const u=new SpeechSynthesisUtterance(tx);u.lang=this.voice?this.voice.lang:'es-ES';if(this.voice)u.voice=this.voice;u.rate=rate||S.settings.rate;
  let done=false,tm=null;const fin=()=>{if(!done){done=true;clearTimeout(tm);res()}};u.onend=fin;u.onerror=fin;
  tm=setTimeout(fin,2500+tx.length*140/u.rate);speechSynthesis.speak(u)})},
 async seq(arr,rate){const my=++this.tok;for(const t of arr){if(my!==this.tok)return false;await this.speak(t,rate)}return my===this.tok},
 say(t,rate){this.stop();return this.seq([t],rate)},

let AC;
function beep(ok){if(!S.settings.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;const notes=ok?[523,659,784]:[330,262];
 notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;const t=t0+i*0.12;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.3)})}catch(e){}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.5,vx:(Math.random()-0.5)*4,vy:2+Math.random()*4,r:5+Math.random()*6,a:Math.random()*6,col:pick(['#f7b733','#2f6fd6','#1f9d55','#d6336c','#9c36b5','#fc6a1a'])}));
 let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=0.15;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++n<150)requestAnimationFrame(f);else c.remove()})()}
let toastT;
function toast(m,ms){const old=$('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),ms||2600)}

/* ================== texto: limpieza, frases, fragmentos ================== */
function cleanText(t){t=String(t).replace(/\r/g,'').replace(/[ \t ]+/g,' ');const out=[];
 for(let ln of t.split('\n')){ln=ln.trim();
  if(!ln){if(out.length&&out[out.length-1]!=='')out.push('');continue}
  if(/^(p[aá]g(ina)?\.?\s*)?\d{1,3}$/i.test(ln))continue;
  ln=ln.replace(/^[•●▪■◦‣*·–—-]\s*/,'• ').replace(/^• •\s*/,'• ');
  let pi=out.length-1;while(pi>=0&&out[pi]==='')pi--;
  const prev=pi>=0?out[pi]:'';const blankBetween=pi!==out.length-1;
  if(prev&&!ln.startsWith('• ')&&!blankBetween){
   if(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]-$/.test(prev)&&/^[a-záéíóúüñ]/.test(ln)){out[pi]=prev.slice(0,-1)+ln;continue}
   if(!/[.:!?;»”")]$/.test(prev)&&/^[a-záéíóúüñ(,;]/.test(ln)){out[pi]=prev+' '+ln;continue}}
  out.push(ln)}
 return out.join('\n').replace(/\n{3,}/g,'\n\n').trim()}
function splitSentences(line){const res=[];String(line).split('\n').forEach(l=>{l=l.trim();if(!l)return;
 const m=l.match(/[^.!?…]+(?:[.!?…]+["»”)\]]*|$)/g)||[l];const parts=[];
 m.forEach(p=>{p=p.trim();if(!p)return;const L=parts.length-1;if(L>=0&&/^\d/.test(p)&&/\d[.,]$/.test(parts[L]))parts[L]+=p;else if(L>=0&&(p.length<14||/^[a-záéíóúñ]/.test(p)))parts[L]+=' '+p;else parts.push(p)});
 res.push(...parts)});return res}
function isHeading(ln,next){return ln.length<75&&!/[.,;:]$/.test(ln)&&!ln.startsWith('• ')&&ln.split(/\s+/).length<=10&&!!next&&/^[A-ZÁÉÍÓÚÑ0-9¿¡]/.test(ln)}
function fragmentText(text){const lines=text.split('\n').map(s=>s.trim());const frags=[];let cur={titulo:'',parts:[]},len=0;
 const push=()=>{if(cur.parts.length)frags.push({titulo:cur.titulo,original:cur.parts.join('\n')});cur={titulo:'',parts:[]};len=0};
 for(let i=0;i<lines.length;i++){const ln=lines[i];if(!ln)continue;let j=i+1;while(j<lines.length&&!lines[j])j++;const next=lines[j]||'';
  if(isHeading(ln,next)&&!isHeading(next,'x')||isHeading(ln,next)&&!cur.parts.length){
   if(cur.parts.length)push();cur.titulo=cur.titulo?cur.titulo+' · '+ln:ln;continue}
  let paras=[ln];
  if(ln.length>650){paras=[];let acc='';splitSentences(ln).forEach(s=>{if(acc&&acc.length+s.length>520){paras.push(acc);acc=s}else acc=acc?acc+' '+s:s});if(acc)paras.push(acc)}
  for(const p of paras){if(len>0&&len+p.length>900)push();cur.parts.push(p);len+=p.length;if(len>=600&&!p.startsWith('• '))push()}}
 push();
 const out=[];frags.forEach(f=>{const last=out[out.length-1];if(last&&f.original.length<110&&last.original.length<650){last.original+='\n'+(f.titulo?f.titulo+'\n':'')+f.original}else out.push(f)});
 out.forEach(f=>{if(!f.titulo){const w=wordsOf(f.original).slice(0,5).join(' ');f.titulo=w+'…'}});
 return out}

/* ================== generador sin IA ================== */
function offlineGen(frags){const all=frags.map(f=>f.original).join(' ');const freq={};
 wordsOf(all).forEach(w=>{const n=norm(w);if(n.length<5||STOP.has(n))return;freq[w]=(freq[w]||0)+1});
 const pool=Object.keys(freq);const nums=[...new Set(all.match(/\b\d{1,4}\b/g)||[])];
 function distract(ans,avoid){
  if(/^\d+$/.test(ans)){const n=+ans;let ds=shuffle(nums.filter(x=>x!==ans)).slice(0,2);let k=0;
   while(ds.length<2&&k<30){k++;const step=n>100?10*(1+Math.floor(Math.random()*6)):1+Math.floor(Math.random()*4);const d=String(Math.random()<0.5?n+step:Math.max(0,n-step));if(d!==ans&&!ds.includes(d))ds.push(d)}return ds}
  const isCap=/^[A-ZÁÉÍÓÚÑ]/.test(ans),na=norm(ans),L=ans.length;
  const c=pool.filter(w=>{const nw=norm(w);return nw!==na&&/^[A-ZÁÉÍÓÚÑ]/.test(w)===isCap&&Math.abs(w.length-L)<=4&&!avoid.has(nw)&&nw.slice(0,4)!==na.slice(0,4)});
  const end=na.slice(-2);const same=shuffle(c.filter(w=>norm(w).endsWith(end)));const seen=new Set();const ds=[];
  for(const w of same.concat(shuffle(c))){const k=norm(w).slice(0,5);if(seen.has(k))continue;seen.add(k);ds.push(w);if(ds.length===2)break}
  return ds.length===2?ds:null}
 const qs=[];
 frags.forEach((f,fi)=>{const sents=splitSentences(f.original).map(s=>s.replace(/^•\s*/,'')).filter(s=>{const n=wordsOf(s).length;return n>=6&&n<=34});let made=0;
  for(const s of shuffle(sents)){if(made>=3)break;const ws=wordsOf(s);const avoid=new Set(ws.map(norm));
   const cands=ws.map((w,i)=>{const n=norm(w);let sc=-1;if(/^\d{1,4}$/.test(w))sc=4;else if(i>0&&/^[A-ZÁÉÍÓÚÑ]/.test(w)&&n.length>=4&&!STOP.has(n))sc=3+Math.min(freq[w]||1,3)/3;else if(n.length>=6&&!STOP.has(n))sc=1+Math.min(freq[w]||1,3)/2+w.length/12;return{w,sc}}).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
   let done=false;for(const {w:ans} of cands.slice(0,3)){const ds=distract(ans,avoid);if(!ds)continue;
    const re=new RegExp('(^|[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9])'+escRe(ans)+'(?![A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9])');if(!re.test(s))continue;
    if(made%2===0)qs.push({id:uid(),tipo:'hueco',enunciado:s.replace(re,'$1_____'),opciones:[ans,...ds],correcta:0,explicacion:'En el tema la frase completa es: «'+s+'»',porque:['',...ds.map(d=>'«'+d+'» no es lo que dice el tema en esta frase; aquí se habla de «'+ans+'».')],frag:fi});
    else{const fake=Math.random()<0.5;qs.push({id:uid(),tipo:'vf',enunciado:fake?s.replace(re,'$1'+ds[0]):s,opciones:['Verdadero','Falso'],correcta:fake?1:0,explicacion:fake?'Es falsa: en el tema pone «'+ans+'», no «'+ds[0]+'».':'Es verdadera: el tema lo dice así.',porque:fake?['Has dado por buena una frase con un dato cambiado: el tema dice «'+ans+'», no «'+ds[0]+'». Lee despacio cada palabra clave.','']:['','La frase es exactamente lo que dice el tema; ningún dato está cambiado.'],frag:fi})}
    made++;done=true;break}
   if(!done)continue}});
 return qs}

 for(let p=1;p<=pdf.numPages;p++){const tc=await(await pdf.getPage(p)).getTextContent();let line='',lastY=null;
  for(const it of tc.items){if(typeof it.str!=='string')continue;const y=it.transform[5],h=Math.abs(it.height||it.transform[3]||10)||10;
   if(lastY!==null&&Math.abs(y-lastY)>h*0.5){if(line.trim())lines.push(line);line='';if(Math.abs(y-lastY)>h*1.9)lines.push('')}
   line+=it.str;if(it.hasEOL){if(line.trim())lines.push(line);line=''}lastY=y}
  if(line.trim())lines.push(line);lines.push('')}
 return{text:lines.join('\n'),pages:pdf.numPages}}

 const models=[...new Set([S.settings.model||'gemini-2.5-flash','gemini-2.5-flash','gemini-flash-latest','gemini-2.0-flash'])];let lastErr;

function enrichPrompt(subjName,batch,nq,nd){return`Eres un profesor de Secundaria y Bachillerato especialista en alumnos con TDAH y dificultades de comprensión lectora. El alumno está en 3º de ESO o superior. Vas a preparar material de estudio de la asignatura «${subjName}» a partir del resumen del temario, que te paso dividido en fragmentos numerados.

Devuelve SOLO un JSON válido con esta forma:
{"fragmentos":[{"i":0,"titulo":"...","facil":"...","pregunta":{"tipo":"mc","enunciado":"...","opciones":["...","...","...","..."],"correcta":0,"explicacion":"...","porque":["","...","...","..."]}}],
 "glosario":[{"palabra":"...","definicion":"..."}],

 "desarrollo":[{"enunciado":"...","puntos":["...","...","..."],"modelo":"...","fragmento":0}]}

Reglas:
1. "fragmentos": uno por cada fragmento recibido, con el mismo número "i".
   - "titulo": máximo 6 palabras que digan de qué trata, empezando por un emoji.
   - "facil": el mismo contenido en LECTURA FÁCIL adaptada a un alumno de ESO: frases cortas (máximo 18 palabras), una idea por frase, estructura clara (definición → características → ejemplos), voz activa, sin paréntesis. Conserva TODOS los datos y TODA la terminología técnica que entra en el examen (nombres, fechas, cifras, fórmulas, definiciones); no la sustituyas por palabras infantiles: explícala. Pon cada idea en una línea distinta (usa \\n). Puedes usar viñetas empezando la línea con "• ".
   - "pregunta": una pregunta rápida de comprensión de la idea principal de ese fragmento (tipo "mc" con 4 opciones, o "vf"), con "explicacion" y "porque" igual que las del test.
2. "glosario": entre 8 y 20 términos técnicos o palabras difíciles del texto (escritos exactamente como aparecen), con una definición clara de máximo 20 palabras para un alumno de 3º de ESO.
3. "preguntas": exactamente ${nq} preguntas de test repartidas entre todos los fragmentos ("fragmento" = número i donde está la respuesta):

   - Opciones cortas y de longitud parecida; solo una correcta sin ninguna duda. Varía la posición de la correcta.
   - "explicacion": 1-2 frases claras que expliquen POR QUÉ la correcta es correcta, apoyándote en el tema.
   - "porque": lista con tantos elementos como "opciones". Para cada opción incorrecta, una frase que explique por qué es incorrecta (qué confunde o qué error típico la hace parecer buena). Para la correcta, "".

5. Español de España, tratando al alumno de "tú".

FRAGMENTOS:
${batch.map(f=>`[${f.i}] ${f.titulo&&!/…$/.test(f.titulo)?f.titulo+'\n':''}${f.original}`).join('\n\n')}`}
function normQ(o,fragIdx,nfr){if(!o||!o.enunciado)return null;let tipo=String(o.tipo||'mc').toLowerCase();

 let opciones=Array.isArray(o.opciones)?o.opciones.map(x=>String(x).trim()).filter(Boolean):[];let c=parseInt(o.correcta,10);let pq=Array.isArray(o.porque)?o.porque.map(x=>String(x==null?'':x).trim()):[];
 if(tipo==='vf'){const v=o.correcta;if(typeof v==='boolean')c=v?0:1;else if(typeof v==='string'&&isNaN(parseInt(v,10)))c=/^(v|t|s|c)/i.test(v)?0:1;else if(opciones.length===2&&!isNaN(c))c=/^f/i.test(opciones[c]||'')?1:0;opciones=['Verdadero','Falso']}
 else if(isNaN(c)&&typeof o.correcta==='string')c=opciones.findIndex(x=>norm(x)===norm(o.correcta));
 if(!(c>=0&&c<opciones.length)||opciones.length<2)return null;
 if(tipo==='hueco'&&!/_{2,}/.test(o.enunciado))tipo='mc';
 let fr=Number.isFinite(+o.fragmento)?+o.fragmento:fragIdx;fr=clamp(fr|0,0,Math.max(0,nfr-1));
 if(pq.length!==opciones.length)pq=[];if(c>3)return null;
 return{id:uid(),tipo,enunciado:String(o.enunciado).trim(),opciones:opciones.slice(0,4),correcta:c,explicacion:String(o.explicacion||'').trim(),porque:pq.slice(0,4),frag:fr}}
function normDev(o,fragIdx,nfr){if(!o||!o.enunciado||!o.modelo)return null;const puntos=toArr(o.puntos).slice(0,8);if(puntos.length<2)return null;
 let fr=Number.isFinite(+o.fragmento)?+o.fragmento:fragIdx;fr=clamp(fr|0,0,Math.max(0,nfr-1));return{id:uid(),enunciado:String(o.enunciado).trim(),puntos,modelo:String(o.modelo).trim(),frag:fr}}

async function buildTema({files,pasted,title,s,log}){
 let text='';const aiParts=[];const key=!!S.settings.apiKey.trim();
 for(const f of files){
  if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){const id=log('📄 Leyendo «'+f.name+'»');const r=await pdfText(f);
   if(r.text.replace(/\s/g,'').length<r.pages*60){aiParts.push({inline_data:{mime_type:'application/pdf',data:await fileB64(f)}});log('Parece escaneado: lo leerá la IA',id,'ok')}else{text+='\n\n'+r.text;log('PDF leído ('+r.pages+' pág.)',id,'ok')}}
  else if(/^image\//.test(f.type)||/\.(jpe?g|png|heic|webp)$/i.test(f.name)){aiParts.push(await imagePart(f))}}
 if(aiParts.length){if(!key)throw new Error('Las fotos y los PDF escaneados necesitan la IA. Pon la clave de Gemini en Zona adultos → Ajustes, o pega el texto.');
  const id=log('🔎 La IA está leyendo las páginas…','run');const r=await gemini([{text:ocrPrompt()},...aiParts],30000);text+='\n\n'+(r.texto||'');log('Páginas leídas',id,'ok')}
 if(pasted)text+='\n\n'+pasted;
 text=cleanText(text);if(text.replace(/\s/g,'').length<80)throw new Error('No he encontrado texto suficiente en lo que has subido.');
 const id2=log('✂️ Dividiendo el tema en partes cortas','run');const frags=fragmentText(text);log('Tema dividido en '+frags.length+' partes',id2,'ok');
 let questions=[],glos=[],dev=[],ai=false;
 if(key){try{const batches=[];let cur=[],len=0;frags.forEach((f,i)=>{if(len>0&&len+f.original.length>10000){batches.push(cur);cur=[];len=0}cur.push({i,titulo:f.titulo,original:f.original});len+=f.original.length});if(cur.length)batches.push(cur);
   for(let b=0;b<batches.length;b++){const id=log(`✨ La IA prepara lectura adaptada y preguntas${batches.length>1?' ('+(b+1)+'/'+batches.length+')':''}… puede tardar 1 minuto`,'run');
    const nq=clamp(Math.round(batches[b].length*3),10,35);const nd=clamp(Math.round(batches[b].length/2),2,5);const r=await gemini([{text:enrichPrompt(s.name,batches[b],nq,nd)}]);
    (r.fragmentos||[]).forEach(o=>{const f=frags[+o.i];if(!f)return;if(o.titulo)f.titulo=String(o.titulo).trim();if(o.facil)f.facil=String(o.facil).replace(/\\n/g,'\n').trim();const q=normQ(o.pregunta,+o.i,frags.length);if(q){q.quick=true;questions.push(q);f.qid=q.id}});
    (r.preguntas||[]).forEach(o=>{const q=normQ(o,batches[b][0].i,frags.length);if(q)questions.push(q)});
    (r.desarrollo||[]).forEach(o=>{const d=normDev(o,batches[b][0].i,frags.length);if(d)dev.push(d)});
    (r.glosario||[]).forEach(g=>{if(g&&g.palabra&&g.definicion)glos.push({p:String(g.palabra).trim(),d:String(g.definicion).trim()})});
    log('Hecho',id,'ok')}
   ai=questions.length>=4}catch(e){log('⚠️ IA: '+e.message+' — uso preguntas automáticas',null,'err');questions=[];glos=[];dev=[];frags.forEach(f=>{delete f.facil;delete f.qid})}}
 if(!ai){const id=log('🧩 Creando preguntas automáticas','run');questions=offlineGen(frags);
  frags.forEach((f,i)=>{const q=questions.find(q=>q.frag===i);if(q){q.quick=true;f.qid=q.id}});log(questions.length+' preguntas creadas',id,'ok')}
 if(!questions.length)throw new Error('No he podido crear preguntas con este texto. Prueba con otro PDF o pon la clave de Gemini.');
 return{id:uid(),title:title||'Tema '+(s.temas.length+1),created:Date.now(),ai,text,frags,glos,questions,dev,readFrags:[]}}

function makeLog(ul){return(msg,id,state)=>{const ex=id&&id!=='run'&&document.getElementById(id);
 if(ex){ex.className=state==='err'?'err':'ok';ex.innerHTML=(state==='err'?'❌ ':'✅ ')+esc(msg);return id}

A.sDel=d=>{const s=subj(d.id);confirmBox(`<b>${esc(s.name)}</b> irá a la papelera con todos sus temas. Se puede recuperar desde Copias → Papelera.`,'Mover a la papelera',()=>{snapshot('antes de borrar '+s.name);S.trash.unshift({type:'subj',item:s,d:Date.now()});S.subjects=S.subjects.filter(x=>x.id!==d.id);save(true);render()})};
A.tRen=d=>{const{t}=getST(d.s,d.t);promptBox('Nombre del tema',t.title,v=>{if(v){t.title=v;save();render()}})};
A.tDel=d=>{const{s,t}=getST(d.s,d.t);confirmBox(`El tema <b>${esc(t.title)}</b> irá a la papelera. Se puede recuperar desde Copias → Papelera.`,'Mover a la papelera',()=>{snapshot('antes de borrar '+t.title);S.trash.unshift({type:'tema',sid:s.id,sname:s.name,item:t,d:Date.now()});s.temas=s.temas.filter(x=>x.id!==d.t);save(true);render()})};
A.tQs=d=>{const{t}=getST(d.s,d.t);MCB.st=d;modal(`<h2>Preguntas · ${esc(t.title)}</h2><p class="hint">Si alguna pregunta está mal o es confusa, bórrala con 🗑️.</p><div class="qlist">${t.questions.map(q=>{const x=st(q.id);return`<div class="q"><div><b>${esc(q.enunciado)}</b><br>✔ ${esc(q.opciones[q.correcta])} <span class="hint">· ${{mc:'elegir',vf:'V/F',hueco:'hueco'}[q.tipo]}${q.quick?' · rápida':''}${x?' · '+x.ok+'✅ '+x.fail+'❌':''}</span></div><button class="btn sm warn" data-act="qDel" data-q="${q.id}">🗑️</button></div>`}).join('')}</div>${(t.dev||[]).length?'<h3>✍️ Desarrollo</h3>'+t.dev.map(d=>`<div class="q"><div><b>${esc(d.enunciado)}</b><br><span class="hint">${d.puntos.length} ideas clave${S.devstats[d.id]?' · última nota '+fmtN(S.devstats[d.id].last):''}</span></div><button class="btn sm warn" data-act="devDel" data-q="${d.id}">🗑️</button></div>`).join(''):''}<button class="btn big" data-act="mclose" style="margin-top:12px">Cerrar</button>`)};
A.devDel=d=>{const{t}=getST(MCB.st.s,MCB.st.t);t.dev=(t.dev||[]).filter(x=>x.id!==d.q);save();A.tQs(MCB.st)};
A.qDel=d=>{const{t}=getST(MCB.st.s,MCB.st.t);t.questions=t.questions.filter(q=>q.id!==d.q);t.frags.forEach(f=>{if(f.qid===d.q)delete f.qid});save();A.tQs(MCB.st)};
A.tRegen=d=>{if(!S.settings.apiKey.trim()){toast('Primero pon la clave de Gemini en Ajustes');return}const{s,t}=getST(d.s,d.t);
 confirmBox(`Se volverán a crear la lectura fácil y las preguntas de <b>${esc(t.title)}</b> con la IA. El progreso de este tema se reinicia.`,'Rehacer',async()=>{
  modal(`<h2>✨ Rehaciendo el tema</h2><ul class="prog" id="rg"></ul>`);const ul=$('#rg');const log=makeLog(ul);
  try{await snapshot('antes de rehacer '+t.title);const nt=await buildTema({files:[],pasted:t.text,title:t.title,s,log});if(!nt.ai)throw new Error('La IA no respondió bien; no se ha cambiado nada.');Object.assign(t,{frags:nt.frags,glos:nt.glos,questions:nt.questions,dev:nt.dev,ai:true,readFrags:[],text:nt.text});save();closeModal();toast('✅ Tema rehecho');render()}
  catch(e){ul.insertAdjacentHTML('beforeend',`<li class="err">❌ ${esc(e.message)}</li>`);ul.insertAdjacentHTML('afterend','<button class="btn big" data-act="mclose">Cerrar</button>')}})};
function shareOrDownload(name,obj){const txt=JSON.stringify(obj);try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
A.expAll=()=>{S.lastBackup=Date.now();save(true);shareOrDownload('LeoYAprendo-copia-'+(S.profile.name||'alumno').replace(/\W+/g,'')+'-'+dstr(Date.now())+'.json',Object.assign({kind:'backup'},S,{settings:Object.assign({},S.settings,{apiKey:''})}));if(view.name==='home')render()};
A.expTemas=()=>shareOrDownload('LeoYAprendo-temas-'+dstr(Date.now())+'.json',{kind:'temas',subjects:S.subjects.map(s=>({...s,temas:s.temas.map(t=>({...t,readFrags:[]}))}))});
A.impFile=async(d,el)=>{const f=el.files[0];if(!f)return;let o;try{o=JSON.parse(await f.text())}catch(e){toast('El archivo no es válido');return}el.value='';
 if(o.kind==='temas'){await snapshot('antes de añadir temas compartidos');let n=0;(o.subjects||[]).forEach(ns=>{let s=S.subjects.find(x=>norm(x.name)===norm(ns.name));if(!s){s={...ns,temas:[]};S.subjects.push(s)}(ns.temas||[]).forEach(t=>{if(!s.temas.some(x=>x.id===t.id)){s.temas.push(t);n++}})});save(true);toast(`📥 ${n} temas añadidos`);render()}
 else if(o.subjects){confirmBox('Se sustituirá todo lo de este iPad por la copia. Antes se guarda la situación actual como versión, así que se puede deshacer. La clave de Gemini se mantiene.','Cargar copia',async()=>{await snapshot('antes de cargar una copia');const key=S.settings.apiKey;const ns=Object.assign(defState(),o);ns.settings=Object.assign(defState().settings,o.settings||{},{apiKey:key});delete ns.kind;S=ns;save(true);toast('✅ Copia cargada');go('home')})}
 else toast('El archivo no es de Leo y Aprendo')};
A.wipe=()=>confirmBox('Se borrará <b>todo</b>: asignaturas, temas, historial, progreso y ajustes. Se guardará antes una versión automática por si te arrepientes.','Borrar todo',async()=>{await snapshot('antes de borrar todo');S=defState();save(true);go('setup')});
async function fillCopy(){const p=$('#persist');if(p){let t='';try{const ok=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():false;const e=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate():null;
  t=(ok?'✅ El navegador ha marcado los datos como <b>protegidos</b> (no los borra para liberar espacio).':'⚠️ El navegador no garantiza conservar los datos. Ábrela siempre desde el <b>icono de la pantalla de inicio</b> y guarda copia fuera del iPad.')+(e&&e.usage?' · Ocupa '+(e.usage/1048576).toFixed(1)+' MB.':'')}catch(x){t='No se puede comprobar en este navegador.'}p.innerHTML=t}
 const el=$('#snaps');if(!el)return;const ks=(await DB.keys()).filter(x=>String(x).startsWith('snap_')).sort().reverse();const rows=[];for(const k of ks){const v=await DB.get(k);if(v)rows.push({k,v})}
 el.innerHTML=rows.length?rows.map(r=>`<div class="trow"><div class="tt">${fdate(r.v.d)}<div class="hint" style="font-weight:400">${esc(r.v.reason)} · ${(r.v.state.subjects||[]).length} asignaturas · ${(r.v.state.history||[]).length} sesiones</div></div><button class="btn sm" data-act="snapRes" data-k="${r.k}">↩️ Volver a esta versión</button></div>`).join(''):'Aún no hay versiones guardadas.'}
A.snapRes=async d=>{const v=await DB.get(d.k);if(!v)return;confirmBox(`Se volverá a la versión del <b>${fdate(v.d)}</b>. Antes se guardará la situación actual como otra versión, así que no se pierde nada.`,'Volver a esa versión',async()=>{await snapshot('antes de volver a una versión anterior');const key=S.settings.apiKey;S=Object.assign(defState(),v.state);S.settings=Object.assign(defState().settings,v.state.settings||{},{apiKey:key});save(true);toast('✅ Versión recuperada');go('home')})};
A.trRes=d=>{const x=S.trash[+d.i];if(!x)return;if(x.type==='subj'){S.subjects.push(x.item)}else{let s=subj(x.sid)||S.subjects.find(y=>norm(y.name)===norm(x.sname));if(!s){s={id:x.sid,name:x.sname,emoji:'📘',color:COLORS[S.subjects.length%COLORS.length],temas:[]};S.subjects.push(s)}s.temas.push(x.item)}S.trash.splice(+d.i,1);save(true);toast('↩️ Recuperado');render()};
A.trDel=d=>{const x=S.trash[+d.i];if(!x)return;confirmBox(`<b>${esc(x.type==='subj'?x.item.name:x.item.title)}</b> se eliminará para siempre (seguirá en las versiones automáticas unos días).`,'Eliminar',()=>{S.trash.splice(+d.i,1);save(true);render()})};
A.hist=d=>{TTS.stop();go('hist',{sid:(d&&d.sid)||S.activeSubject})};
A.histOpen=d=>go('histItem',{id:d.id});
A.histRedo=d=>{const h=S.history.find(x=>x.id===d.id);const s=subj(h.sid);if(!s)return;S.activeSubject=s.id;const items=[];h.det.filter(x=>!x.dev&&!x.ok).forEach(x=>{s.temas.forEach(t=>{const q=t.questions.find(q=>q.enunciado===x.enunciado);if(q)items.push({temaId:t.id,qid:q.id})})});
 if(!items.length){toast('Esas preguntas ya no existen en los temas actuales');return}startQuiz('fallos',null,shuffle(items))};
A.setName=(d,el)=>{S.profile.name=el.value.trim()||S.profile.name;save()};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el,e)}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset.file){for(const f of el.files)PEND.push(f);el.value='';paintFiles();const t=$('#at-title');if(t&&!t.value&&PEND[0]&&/pdf/i.test(PEND[0].type))t.value=PEND[0].name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');return}
 if(el.dataset.set){const k=el.dataset.set;let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.num)v=+v;if(k==='pin'&&v&&!/^\d{4}$/.test(v)){toast('El código tiene que ser de 4 números');el.value=S.settings.pin;return}
  S.settings[k]=v;save();applyTheme();if(k==='voiceURI'){TTS.load();A.vtest()}return}
 if(el.dataset.chg&&A[el.dataset.chg])A[el.dataset.chg](el.dataset,el)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.set==='fs'){$('#fsv').textContent=el.value;S.settings.fs=+el.value;applyTheme()}if(el.dataset.set==='rate'){$('#ratev').textContent=el.value}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#modal #mp, #modal #ms-name')){e.preventDefault();A.mok()}});

/* ================== arranque ================== */
(async()=>{await DB.open();const saved=await DB.get('state');if(saved&&typeof saved==='object'){S=Object.assign(defState(),saved);S.settings=Object.assign(defState().settings,saved.settings||{});S.profile=Object.assign(defState().profile,saved.profile||{})}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 TTS.load();go(S.setup?'home':'setup');if(S.setup&&S.lastSnap!==dstr(Date.now())){await snapshot('copia automática diaria');S.lastSnap=dstr(Date.now());save()}})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
